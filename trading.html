    <script>
    (function(){
        'use strict';

        // --- 1. DISABLE KLIK KANAN ---
        document.addEventListener('contextmenu', function(e){ e.preventDefault(); }, true);

        // --- 2. DISABLE TEXT SELECT ---
        document.addEventListener('selectstart', function(e){
            // Izinkan select di input & textarea
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            e.preventDefault();
        }, true);

        // --- 3. DISABLE DRAG ---
        document.addEventListener('dragstart', function(e){ e.preventDefault(); }, true);

        // --- 4. DISABLE KEYBOARD SHORTCUTS BERBAHAYA ---
        document.addEventListener('keydown', function(e){
            var k = e.key ? e.key.toLowerCase() : '';
            var ctrl = e.ctrlKey || e.metaKey;
            var shift = e.shiftKey;

            // F12
            if(e.key === 'F12'){ e.preventDefault(); e.stopPropagation(); return false; }
            // Ctrl+U (view-source)
            if(ctrl && k === 'u'){ e.preventDefault(); e.stopPropagation(); return false; }
            // Ctrl+S (save)
            if(ctrl && k === 's'){ e.preventDefault(); e.stopPropagation(); return false; }
            // Ctrl+P (print)
            if(ctrl && k === 'p'){ e.preventDefault(); e.stopPropagation(); return false; }
            // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C / Ctrl+Shift+K
            if(ctrl && shift && (k === 'i' || k === 'j' || k === 'c' || k === 'k')){
                e.preventDefault(); e.stopPropagation(); return false;
            }
            // Ctrl+A, blokir hanya di luar input/textarea
            if(ctrl && k === 'a'){
                if(document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){
                    e.preventDefault(); e.stopPropagation(); return false;
                }
            }
        }, true);

        // --- 5. DEVTOOLS DETECTOR v2 ---
        // Tiga lapis deteksi: (a) selisih ukuran window = DevTools docked,
        // (b) jebakan debugger = DevTools undocked / remote debugging,
        // (c) console getter = console sedang dibuka. Perlu 2 cek positif
        // beruntun sebelum memblokir (mencegah false positive sesaat).
        // Kalau terdeteksi, isi halaman diganti layar AKSES DITOLAK sampai refresh.
        var _fsDtHits = 0;
        var _fsDtDone = false;
        var _fsDtImg = new Image();
        var _fsDtConsole = false;
        try {
            Object.defineProperty(_fsDtImg, 'id', { get: function(){ _fsDtConsole = true; } });
        } catch(e) {}
        function _fsDtShowBlocked(){
            if (_fsDtDone) return;
            _fsDtDone = true;
            try { document.title = 'AKSES DITOLAK: Freedom Syndicate'; } catch(e) {}
            if (!document.body) return;
            document.body.innerHTML = [
                '<div style="display:flex;flex-direction:column;align-items:center;',
                'justify-content:center;height:100vh;background:var(--ink);color:var(--red-text);',
                'font-family:monospace;text-align:center;gap:14px;padding:20px;">',
                '<div style="font-size:1.1rem;font-weight:900;letter-spacing:3px;color:var(--red-text);">AKSES DITOLAK</div>',
                '<div style="font-size:0.75rem;color:var(--paper-faint);letter-spacing:2px;">FREEDOM SYNDICATE SECURITY SHIELD v3.1</div>',
                '<div style="font-size:0.68rem;color:var(--paper-dim);margin-top:4px;">Tutup Developer Tools &amp; refresh halaman.</div>',
                '</div>'
            ].join('');
        }
        // Hook kecil untuk tes: window.__fsDtBlock() menampilkan layar blokir.
        try { window.__fsDtBlock = _fsDtShowBlocked; } catch(e) {}
        setInterval(function(){
            if (_fsDtDone) return;
            var open = false;
            // (a) DevTools docked: selisih ukuran window (skip layar kecil/mobile).
            if (window.outerWidth >= 500) {
                var wDiff = window.outerWidth - window.innerWidth;
                var hDiff = window.outerHeight - window.innerHeight;
                if (wDiff > 200 || hDiff > 200) open = true;
            }
            // (b) DevTools undocked/remote: debugger berhenti lama hanya kalau DevTools terbuka.
            if (!open) {
                var t0 = performance.now();
                debugger;
                if (performance.now() - t0 > 100) open = true;
            }
            // (c) Console terbuka: getter Image terpicu saat console merender log.
            if (!open) {
                _fsDtConsole = false;
                try { console.log('%c', _fsDtImg); } catch(e) {}
                if (_fsDtConsole) open = true;
            }
            if (open) {
                _fsDtHits++;
                if (_fsDtHits >= 2) _fsDtShowBlocked();
            } else {
                _fsDtHits = 0;
            }
        }, 1000);


        // --- 6. DISABLE PRINT ---
        window.addEventListener('beforeprint', function(e){ e.preventDefault(); window.stop(); });

        // --- 7. CSS ANTI SELECT (inline, berlaku sejak awal render) ---
        var _s = document.createElement('style');
        _s.textContent = [
            '* { -webkit-user-select:none!important; -moz-user-select:none!important;',
            '-ms-user-select:none!important; user-select:none!important;',
            '-webkit-touch-callout:none!important; }',
            'input, textarea, [contenteditable] {',
            '-webkit-user-select:text!important; user-select:text!important; }'
        ].join('');
        document.head.appendChild(_s);

    })();
    </script>

    <script>
    function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function _fsFetchJson(url, ms) {
                    return new Promise(function(resolve, reject) {
                        var done = false;
                        var t = setTimeout(function(){ if (!done) { done = true; reject(new Error('timeout')); } }, ms || 8000);
                        fetch(url).then(function(r){
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.json();
                        }).then(function(d){
                            if (!done) { done = true; clearTimeout(t); resolve(d); }
                        }).catch(function(e){
                            if (!done) { done = true; clearTimeout(t); reject(e); }
                        });
                    });
                }

    <script>
        const sidebar = document.getElementById('sidebar');

            var overlay = document.getElementById('pageOverlay');

        }
        function openTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(function(t){ t.classList.remove('active'); });
            document.querySelectorAll('.sidebar-menu button').forEach(function(b){ b.classList.remove('active-tab'); });
            var el = document.getElementById(tabId);

<script>
// PWA: pop-up instal saat pertama buka + tombol instal di tab download.
(function(){
  var DISMISS_KEY = 'fsPwaDismissedAt';
  var DISMISS_MS = 7*24*60*60*1000;
  function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
  function dismissedRecently(){ try { var t = parseInt(localStorage.getItem(DISMISS_KEY) || '0', 10); return (Date.now() - t) < DISMISS_MS; } catch(e){ return false; } }
  function markDismissed(){ try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch(e){} }
  function hidePop(){ var p = document.getElementById('fsPwaPop'); if (p) p.remove(); }
  function showPop(){
    if (isStandalone() || dismissedRecently() || document.getElementById('fsPwaPop')) return;
    var pop = document.createElement('div');
    pop.id = 'fsPwaPop';
    pop.setAttribute('role', 'dialog');
    pop.setAttribute('aria-label', 'Instal aplikasi Freedom Syndicate');
    pop.style.cssText = 'position:fixed;left:12px;right:12px;bottom:78px;z-index:9999;background:var(--ink-2);border:1px solid var(--gold-dim);border-radius:6px;padding:14px 12px;box-shadow:0 12px 40px color-mix(in srgb, var(--black) 60%, transparent);display:flex;gap:12px;align-items:center;';
    pop.innerHTML = '<img src="icon-192.png" alt="" width="52" height="52" style="width:52px;height:52px;border-radius:6px;flex:0 0 auto;">'
      + '<div style="flex:1;min-width:0;"><div style="color:var(--paper);font-weight:700;font-size:.98rem;line-height:1.3;">Instal Freedom Syndicate</div>'
      + '<div style="color:var(--paper-dim);font-size:.8rem;line-height:1.45;margin-top:2px;">Jadi aplikasi di HP, tanpa download APK, buka lebih cepat.</div></div>'
      + '<button id="fsPwaPopInstall" type="button" style="flex:0 0 auto;background:var(--gold);color:var(--ink);border:0;border-radius:6px;padding:10px 14px;font-weight:800;font-size:.88rem;cursor:pointer;font-family:inherit;">Instal</button>'
      + '<button id="fsPwaPopClose" type="button" aria-label="Tutup" style="position:absolute;top:4px;right:10px;background:none;border:0;color:var(--paper-faint);font-size:1.05rem;cursor:pointer;line-height:1;font-family:inherit;"><img src="icons/close.svg" width="24" height="24" alt="" aria-hidden="true" class="fs-ico"></button>';
    document.body.appendChild(pop);
    document.getElementById('fsPwaPopClose').addEventListener('click', function(){ markDismissed(); hidePop(); });
    document.getElementById('fsPwaPopInstall').addEventListener('click', function(){ doInstall(); });
  }
  // Dipakai untuk tes: paksa tampilkan pop-up.
  window.fsPwaShow = function(){ try { localStorage.removeItem(DISMISS_KEY); } catch(e){} showPop(); };
  function doInstall(){
    var p = window._fsPwaPrompt;
    if (p) {
      hidePop();
      p.prompt();
      if (p.userChoice) { p.userChoice.then(function(choice){ if (choice && choice.outcome === 'accepted') { markDismissed(); } window._fsPwaPrompt = null; syncDownloadBtn(); }); }
      else { window._fsPwaPrompt = null; syncDownloadBtn(); }
    } else {
      var h = document.getElementById('fsPwaHint');
      if (h) { h.style.color = 'var(--paper)'; h.scrollIntoView({behavior:'smooth', block:'center'}); }
    }
  }
  function syncDownloadBtn(){
    var b = document.getElementById('fsPwaInstallBtn');
    if (!b) return;
    if (isStandalone()) { b.style.display = 'none'; return; }
    b.style.display = '';
    var sub = b.querySelector('.mod-btn-sub');
    if (sub) sub.textContent = window._fsPwaPrompt ? 'Instal langsung dari Chrome (PWA)' : 'Buka di Chrome \u2192 titik tiga \u2192 Instal aplikasi';
  }
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    window._fsPwaPrompt = e;
    syncDownloadBtn();
    setTimeout(showPop, 1500);
  });
  window.addEventListener('appinstalled', function(){ markDismissed(); hidePop(); syncDownloadBtn(); });
  var dl = document.getElementById('fsPwaInstallBtn');
  if (dl) { dl.addEventListener('click', function(){ doInstall(); }); syncDownloadBtn(); }
})();
</script>
