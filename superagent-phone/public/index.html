<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuperAgent — HP</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e8eaf0; min-height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: #171a21; border-bottom: 1px solid #262a33; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; }
  header h1 { font-size: 16px; margin: 0; }
  header small { color: #9aa3b2; display: block; font-size: 11px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; flex: none; }
  .dot.on { background: #34d399; } .dot.busy { background: #fbbf24; }
  #log { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 10px 12px; border-radius: 14px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1d4ed8; border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: #1c2029; border: 1px solid #2a2f3a; border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: transparent; color: #8b93a5; font-size: 12px; padding: 2px 8px; }
  .tool { align-self: flex-start; background: #14171d; border: 1px dashed #333a47; color: #9aa3b2; font-size: 12px; font-family: ui-monospace, monospace; max-width: 92%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-all; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 14px 10px; }
  .chip { flex: none; border: 1px solid #333a47; background: #171a21; color: #cdd3df; border-radius: 999px; padding: 7px 12px; font-size: 13px; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: #171a21; border-top: 1px solid #262a33; position: sticky; bottom: 0; }
  input { flex: 1; border: 1px solid #333a47; background: #0f1115; color: #e8eaf0; border-radius: 999px; padding: 12px 16px; font-size: 16px; outline: none; }
  input:focus { border-color: #1d4ed8; }
  button { border: none; background: #1d4ed8; color: #fff; border-radius: 999px; padding: 0 20px; font-size: 15px; font-weight: 600; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <div><h1>SuperAgent</h1><small>Box main &middot; otak gratis &middot; YOLO FULL</small></div>
</header>
<div id="log"></div>
<div class="chips" id="chips">
  <button class="chip" type="button">Cek status bot</button>
  <button class="chip" type="button">Lihat isi /workspace</button>
  <button class="chip" type="button">Buatkan file hello.txt</button>
  <button class="chip" type="button">Cek ruang kosong disk</button>
</div>
<form id="form">
  <input id="input" type="text" placeholder="Perintah buat SuperAgent…" autocomplete="off" enterkeyhint="send">
  <button id="send" type="submit">Kirim</button>
</form>
<script>
const log = document.getElementById('log');
const dot = document.getElementById('dot');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const form = document.getElementById('form');

function add(cls, text) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function setDot(state) { dot.className = 'dot' + (state ? ' ' + state : ''); }

async function health() {
  try {
    const r = await fetch('/api/health');
    const j = await r.json();
    setDot(j.ws ? (j.busy ? 'busy' : 'on') : '');
  } catch { setDot(''); }
}
health(); setInterval(health, 10000);

let currentAgent = null;

async function ask(text) {
  add('msg user', text);
  sendBtn.disabled = true; setDot('busy');
  currentAgent = add('msg agent', 'Mengerjakan…');
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!res.ok) { currentAgent.textContent = 'Server menolak (' + res.status + '). Coba lagi.'; return; }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const line = p.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.type === 'status') currentAgent.textContent = ev.text;
        else if (ev.type === 'cmd') add('tool', '$ ' + ev.text);
        else if (ev.type === 'out') add('tool', ev.text);
        else if (ev.type === 'answer') currentAgent.textContent = ev.text;
        else if (ev.type === 'error') currentAgent.textContent = ev.text;
      }
    }
  } catch (e) {
    currentAgent.textContent = 'Koneksi putus: ' + e.message + '. Coba kirim lagi.';
  }
  sendBtn.disabled = false; health();
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t) return;
  input.value = ''; ask(t);
});
document.getElementById('chips').addEventListener('click', (e) => {
  if (e.target.classList.contains('chip')) { input.value = e.target.textContent; form.requestSubmit(); }
});
add('msg sys', 'Terhubung ke SuperAgent di Box main. Ketik perintah, dia yang mengerjakan.');
input.focus();
</script>
</body>
</html>
